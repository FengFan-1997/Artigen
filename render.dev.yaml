services:
  - type: web
    name: dev-artigen-app-fengfan
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/FengFan-1997/Artigen
    branch: dev
    buildCommand: pnpm install --frozen-lockfile && VITE_APP_ENV=dev VITE_API_BASE='' VITE_AGENT_API_BASE='' pnpm build
    startCommand: pnpm start:production
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: dev
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        value: https://dev-artigen-app-fengfan.onrender.com
      - key: CORS_ORIGINS
        value: https://dev-artigen-app-fengfan.onrender.com
      - key: DEV_ACCESS_USERNAME
        value: artigen-dev
      - key: DEV_ACCESS_PASSWORD
        sync: false
      - key: DEV_ACCESS_COOKIE_TTL_HOURS
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: DEV_DATABASE_EXPECTED_HOST
        sync: false
      - key: DEV_DATABASE_EXPECTED_MAJOR
        value: "18"
      - key: PG_POOL_MAX
        value: "3"
      - key: PG_SSL_REQUIRED
        value: "1"
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "1"
      - key: PG_SSL_CA_BASE64
        sync: false
      - key: PGBOSS_SCHEMA
        value: pgboss
      - key: PGBOSS_POOL_MAX
        value: "2"
      - key: AGENT_PGBOSS_POOL_MAX
        value: "2"
      - key: CSRF_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: SESSION_TOKEN_HASH_SECRET
        generateValue: true
      - key: CONSOLE_ADMIN_TOKEN_SECRET
        generateValue: true
      - key: PAID_FEATURES_ENABLED
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: AUTH_EMAIL_OTP_ENABLED
        value: "false"
      - key: AI_DESIGN_TASK_V2_ENABLED
        value: "false"
      - key: WORKSHOP_AI_TASK_V2_ENABLED
        value: "false"
      - key: AI_DESIGN_TASK_V2_ROLLOUT_PERCENT
        value: "0"
      - key: TASK_WORKER_ENABLED
        value: "0"
      # All non-image text traffic is pinned to Cloudflare GPT-OSS; only
      # Kolors image traffic uses the SiliconFlow secret below.
      - key: AGENT_MODEL_PROVIDER
        value: cloudflare
      - key: AGENT_MODEL_NAME
        value: "@cf/openai/gpt-oss-120b"
      - key: AGENT_TEXT_MODEL_HARD_LOCK
        value: "true"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: AGENT_CLOUDFLARE_FREE_ACCOUNT_ID
        sync: false
      - key: AGENT_CLOUDFLARE_FREE_ACCOUNT_ATTESTED
        sync: false
      # The committed DEV blueprint also fails closed. The existing integration
      # service may override these values in Render only after migration and
      # real-dependency readiness have been verified.
      - key: AGENT_BETA_MODE
        value: disabled
      - key: AGENT_RUNTIME_V2_ENABLED
        value: "false"
      - key: AGENT_RUNTIME_V2_ROLLOUT_PERCENT
        value: "0"
      - key: AGENT_RUNTIME_V2_CANARY_USER_IDS
        value: ""
      - key: AGENT_SUBAGENTS_ENABLED
        value: "false"
      - key: DESIGN_CONVERSATION_ENABLED
        value: "false"
      - key: DESIGN_CONVERSATION_WORKER_ENABLED
        value: "false"
      - key: DESIGN_CONVERSATION_AUTO_CREDIT_CAP
        value: "50"
      - key: DESIGN_CONVERSATION_RETENTION_DAYS
        value: "30"
      - key: DESIGN_CONVERSATION_AUTH_IDLE_MINUTES
        value: "30"
      - key: VITE_ANALYTICS_ENABLED
        value: "1"
      - key: BEHAVIOR_ANALYTICS_ENABLED
        value: "true"
      - key: BEHAVIOR_EVENT_RETENTION_DAYS
        value: "90"
      - key: BEHAVIOR_EVENT_PURGE_INTERVAL_MS
        value: "3600000"
      - key: BEHAVIOR_EVENT_PURGE_BATCH_SIZE
        value: "5000"
      - key: BEHAVIOR_EVENT_PURGE_MAX_BATCHES
        value: "20"
      - key: ASSET_STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: artigen-assets
      - key: S3_REGION
        value: us-east-2
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
