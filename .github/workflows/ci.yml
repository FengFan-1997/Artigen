name: Quality Gate

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artigen
          POSTGRES_PASSWORD: artigen_ci
          POSTGRES_DB: artigen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artigen -d artigen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      PAID_FEATURES_ENABLED: "false"
      DATABASE_URL: postgresql://artigen:artigen_ci@127.0.0.1:5432/artigen_test?sslmode=disable
      CSRF_SECRET: ci-csrf-secret-not-for-production
      OTP_HMAC_SECRET: ci-otp-secret-not-for-production
      SESSION_TOKEN_HASH_SECRET: ci-session-token-hash-v1-7f2c9d4e6a8b1c3d
      AI_DESIGN_TASK_V2_ENABLED: "true"
      WORKSHOP_AI_TASK_V2_ENABLED: "true"
      AI_GENERATION_CONTRACT_MOCK: "true"
      TASK_QUEUE_DRIVER: pgboss
      TASK_PAYLOAD_ENCRYPTION_KEY: hex:000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
      MINIO_TEST_BUCKET: artigen-ci
      MINIO_ROOT_USER: artigen-minio
      MINIO_ROOT_PASSWORD: artigen-minio-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Verify the single workspace lockfile policy
        run: pnpm check:workspace

      - run: pnpm install --frozen-lockfile

      - name: Start pinned MinIO S3 compatibility fixture
        run: |
          docker run --detach --name artigen-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --env MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs artigen-minio
          exit 1

      - name: Apply PostgreSQL 16 migrations
        run: pnpm --filter backend db:migrate

      - name: Run the core release quality gate
        run: pnpm check:core

  e2e:
    name: E2E (${{ matrix.project }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
            shard: "1/1"
          - project: firefox-desktop
            browser: firefox
            shard: "1/1"
          - project: webkit-desktop
            browser: webkit
            shard: "1/2"
          - project: webkit-desktop
            browser: webkit
            shard: "2/2"
          - project: chromium-mobile-360
            browser: chromium
            shard: "1/1"
          - project: chromium-mobile-390
            browser: chromium
            shard: "1/1"
          - project: webkit-tablet-768
            browser: webkit
            shard: "1/2"
          - project: webkit-tablet-768
            browser: webkit
            shard: "2/2"
    env:
      CI: true
      PAID_FEATURES_ENABLED: "false"
      AI_DESIGN_TASK_V2_ENABLED: "true"
      WORKSHOP_AI_TASK_V2_ENABLED: "true"
      AI_GENERATION_CONTRACT_MOCK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter personal exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} shard ${{ matrix.shard }}
        run: pnpm --filter personal exec playwright test --project=${{ matrix.project }} --fully-parallel --shard=${{ matrix.shard }}

  harness-deterministic:
    name: Agent Harness V3 (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [report, spreadsheet, presentation, website, image]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artigen
          POSTGRES_PASSWORD: artigen_ci
          POSTGRES_DB: artigen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artigen -d artigen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      RUN_POSTGRES_INTEGRATION: "1"
      DATABASE_URL: postgresql://artigen:artigen_ci@127.0.0.1:5432/artigen_test?sslmode=disable
      TASK_PAYLOAD_ENCRYPTION_KEY: hex:000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
      MINIO_TEST_BUCKET: artigen-harness-${{ matrix.group }}
      MINIO_ROOT_USER: artigen-minio
      MINIO_ROOT_PASSWORD: artigen-minio-secret
      AGENT_QUALITY_GROUP: ${{ matrix.group }}
      AGENT_QUALITY_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start pinned MinIO fixture
        run: |
          docker run --detach --name artigen-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --env MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs artigen-minio
          exit 1

      - name: Apply PostgreSQL 16 migrations
        run: pnpm --filter backend db:migrate

      - name: Execute the real Runtime quality group
        run: pnpm eval:agent:deterministic

      - name: Upload content-free Harness diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-v3-${{ matrix.group }}
          path: .artifacts/agent-harness-v3/
          if-no-files-found: ignore
          retention-days: 14

  harness-chaos:
    name: Agent Harness V3 chaos (${{ github.event_name == 'schedule' && '20x' || '1x' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artigen
          POSTGRES_PASSWORD: artigen_ci
          POSTGRES_DB: artigen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artigen -d artigen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      RUN_POSTGRES_INTEGRATION: "1"
      DATABASE_URL: postgresql://artigen:artigen_ci@127.0.0.1:5432/artigen_test?sslmode=disable
      TASK_PAYLOAD_ENCRYPTION_KEY: hex:000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
      MINIO_TEST_BUCKET: artigen-harness-chaos
      MINIO_ROOT_USER: artigen-minio
      MINIO_ROOT_PASSWORD: artigen-minio-secret
      AGENT_CHAOS_REPEATS: ${{ github.event_name == 'schedule' && '20' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start pinned MinIO fixture
        run: |
          docker run --detach --name artigen-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --env MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs artigen-minio
          exit 1

      - name: Apply PostgreSQL 16 migrations
        run: pnpm --filter backend db:migrate

      - name: Execute deterministic crash and concurrency injection
        run: pnpm test:agent:chaos

      - name: Upload content-free chaos diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-v3-chaos
          path: .artifacts/agent-harness-v3/
          if-no-files-found: ignore
          retention-days: 14

  release-policy:
    name: Release branch policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow only verified promotion or emergency sources
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|hotfix/*|codex/artigen-overhaul)
              echo "Allowed release source: $HEAD_REF"
              ;;
            *)
              echo "::error::main only accepts dev, hotfix/*, or the one-time codex/artigen-overhaul migration branch"
              exit 1
              ;;
          esac

  release-gate:
    name: Release gate
    if: always()
    needs: [core, e2e, harness-deterministic, harness-chaos, release-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Artigen quality job
        env:
          CORE_RESULT: ${{ needs.core.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HARNESS_RESULT: ${{ needs.harness-deterministic.result }}
          CHAOS_RESULT: ${{ needs.harness-chaos.result }}
          POLICY_RESULT: ${{ needs.release-policy.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$HARNESS_RESULT" = "success"
          test "$CHAOS_RESULT" = "success"
          case "$POLICY_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
